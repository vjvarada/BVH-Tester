<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Projected Offset Generator - BVH Accelerated</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: #1a1a1a;
            color: #fff;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #ui-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(30, 30, 30, 0.95);
            padding: 20px;
            border-radius: 10px;
            z-index: 100;
            max-width: 350px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #4fc3f7;
        }

        .section {
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #81c784;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
        }

        input[type="file"] {
            display: none;
        }

        .file-upload-btn {
            display: block;
            width: 100%;
            padding: 10px;
            background: #4fc3f7;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        .file-upload-btn:hover {
            background: #0288d1;
        }

        input[type="number"] {
            width: 100%;
            padding: 8px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 5px;
            color: #fff;
            font-size: 13px;
        }
        
        input[type="range"] {
            width: 100%;
            height: 6px;
            background: #444;
            border-radius: 3px;
            outline: none;
            -webkit-appearance: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            background: #4fc3f7;
            border-radius: 50%;
            cursor: pointer;
        }
        
        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: #4fc3f7;
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background: #81c784;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        button:hover {
            background: #4caf50;
        }

        button:disabled {
            background: #555;
            cursor: not-allowed;
        }

        .checkbox-group {
            margin-top: 10px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }

        .checkbox-item input {
            margin-right: 8px;
            width: auto;
        }

        #status {
            margin-top: 15px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 5px;
            font-size: 12px;
            color: #4fc3f7;
            max-height: 150px;
            overflow-y: auto;
        }

        .log-entry {
            margin-bottom: 5px;
        }

        .log-success {
            color: #81c784;
        }

        .log-error {
            color: #e57373;
        }

        .log-info {
            color: #4fc3f7;
        }

        #stats-container {
            position: fixed;
            top: 0;
            right: 0;
            z-index: 100;
        }
        
        /* Progress Bar Styles */
        #progress-container {
            margin-top: 15px;
            display: none;
        }
        
        #progress-container.active {
            display: block;
        }
        
        .progress-label {
            font-size: 12px;
            color: #4fc3f7;
            margin-bottom: 5px;
        }
        
        .progress-bar-wrapper {
            width: 100%;
            height: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }
        
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #4fc3f7, #81c784);
            border-radius: 10px;
            transition: width 0.3s ease;
            width: 0%;
        }
        
        .progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 11px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 3px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body>
    <!-- UI Panel -->
    <div id="ui-panel">
        <h1>🎯 Projected Offset Generator</h1>
        
        <!-- File Upload Section -->
        <div class="section">
            <div class="section-title">1. Load STL File</div>
            <input type="file" id="file-input" accept=".stl" />
            <label for="file-input" class="file-upload-btn">📁 Upload STL</label>
        </div>

        <!-- Offset Configuration -->
        <div class="section">
            <div class="section-title">2. Configure Offset</div>
            <label for="offset-distance">Offset Distance:</label>
            <input type="number" id="offset-distance" value="5" step="0.1" min="0" />
            
            <div class="checkbox-item" style="margin-top: 10px;">
                <input type="checkbox" id="adaptive-resolution" checked />
                <label for="adaptive-resolution">Adaptive Resolution (pixels per unit)</label>
            </div>
            
            <label for="heightmap-resolution" style="margin-top: 10px;" id="resolution-label">Pixels Per Unit:</label>
            <input type="number" id="heightmap-resolution" value="10" step="1" min="1" max="50" />
            
            <label for="mesh-downsample" style="margin-top: 10px;">Mesh Optimization:</label>
            <select id="mesh-downsample">
                <option value="1">Full Quality (1x)</option>
                <option value="2" selected>Optimized (2x downsample)</option>
                <option value="3">Fast (3x downsample)</option>
                <option value="4">Ultra Fast (4x downsample)</option>
            </select>
        </div>

        <!-- Generate Button -->
        <div class="section">
            <button id="generate-btn" disabled>⚡ Generate Projected Offset</button>
            <button id="export-stl-btn" disabled>💾 Export STL</button>
        </div>

        <!-- View Controls -->
        <div class="section">
            <div class="section-title">3. View Options</div>
            <div class="checkbox-group">
                <div class="checkbox-item">
                    <input type="checkbox" id="show-original" checked />
                    <label for="show-original">Show Original Mesh</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="show-offset" />
                    <label for="show-offset">Show Offset Mesh</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="show-heightmap" checked />
                    <label for="show-heightmap">Show Heightmap Mesh</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="show-heightmap-lines" />
                    <label for="show-heightmap-lines">Show Heightmap Contours</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="show-bbox" />
                    <label for="show-bbox">Show Bounding Box</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="show-axes" checked />
                    <label for="show-axes">Show Axes Helper</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="debug-rays" />
                    <label for="debug-rays">Debug Rays (Sample)</label>
                </div>
            </div>
        </div>

        <!-- Status Log -->
        <div id="status">
            <div class="log-entry log-info">Ready to load STL file...</div>
        </div>
        
        <!-- Progress Bar -->
        <div id="progress-container">
            <div class="progress-label" id="progress-label">Processing...</div>
            <div class="progress-bar-wrapper">
                <div class="progress-bar-fill" id="progress-bar-fill"></div>
                <div class="progress-text" id="progress-text">0%</div>
            </div>
        </div>
    </div>

    <!-- Canvas Container -->
    <div id="canvas-container"></div>

    <!-- Stats Container -->
    <div id="stats-container"></div>

    <!-- Three.js and Dependencies -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/",
            "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.7.8/build/index.module.js"
        }
    }
    </script>

    <script type="module" src="app.js"></script>
</body>
</html>
